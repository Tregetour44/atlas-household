script:
  - id: control_leds
    then:
      - lambda: !lambda |
          if (id(voice_kit_component).is_failed()) {
            id(control_leds_voice_kit_startup_failed).execute();
            return;
          }
          id(check_if_timers_active).execute();
          if (id(is_timer_active)){
            id(fetch_first_active_timer).execute();
          }
          if (id(improv_ble_in_progress)) {
            id(control_leds_improv_ble_state).execute();
          } else if (id(init_in_progress)) {
            id(control_leds_init_state).execute();
          } else if (!id(wifi_id).is_connected() || !id(api_id).is_connected()){
            id(control_leds_no_ha_connection_state).execute();
          } else if (id(center_button).state) {
            id(control_leds_center_button_touched).execute();
          } else if (id(jack_plugged_recently)) {
            id(control_leds_jack_plugged_recently).execute();
          } else if (id(jack_unplugged_recently)) {
            id(control_leds_jack_unplugged_recently).execute();
          } else if (id(dial_touched)) {
            id(control_leds_dial_touched).execute();
          } else if (id(timer_ringing).state) {
            id(control_leds_timer_ringing).execute();
          } else if (id(voice_assistant_phase) == 2) {
            id(control_leds_voice_assistant_waiting_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == 3) {
            id(control_leds_voice_assistant_listening_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == 4) {
            id(control_leds_voice_assistant_thinking_phase).execute();
          } else if (id(voice_assistant_phase) == 5) {
            id(control_leds_voice_assistant_replying_phase).execute();
          } else if (id(voice_assistant_phase) == 11) {
            id(control_leds_voice_assistant_error_phase).execute();
          } else if (id(voice_assistant_phase) == 10) {
            id(control_leds_voice_assistant_not_ready_phase).execute();
          } else if (id(is_timer_active)) {
            id(control_leds_timer_ticking).execute();
          } else if (id(master_mute_switch).state) {
            id(control_leds_muted_or_silent).execute();
          } else if (id(external_media_player).volume == 0.0f || id(external_media_player).is_muted()) {
            id(control_leds_muted_or_silent).execute();
          } else if (id(voice_assistant_phase) == 1) {
            id(control_leds_voice_assistant_idle_phase).execute();
          }
    mode: single
    parameters: {}
  - id: control_leds_voice_kit_startup_failed
    then:
      - light.turn_on:
          brightness: 0.4
          red: 0.0
          green: 0.0
          blue: 0.0
          id: voice_assistant_leds
          effect: Voice kit startup failed
          state: true
    mode: single
    parameters: {}
  - id: control_leds_improv_ble_state
    then:
      - light.turn_on:
          brightness: 0.66
          red: 1.0
          green: 0.89
          blue: 0.71
          id: voice_assistant_leds
          effect: Twinkle
          state: true
    mode: single
    parameters: {}
  - id: control_leds_init_state
    then:
      - if:
          condition:
            wifi.connected: {}
          then:
            - light.turn_on:
                brightness: 0.66
                red: 0.094
                green: 0.733
                blue: 0.9490000000000001
                id: voice_assistant_leds
                effect: Twinkle
                state: true
          else:
            - light.turn_on:
                brightness: 0.66
                red: 1.0
                green: 0.89
                blue: 0.71
                id: voice_assistant_leds
                effect: none
                state: true
    mode: single
    parameters: {}
  - id: control_leds_no_ha_connection_state
    then:
      - light.turn_on:
          brightness: 0.66
          red: 1.0
          green: 0.0
          blue: 0.0
          id: voice_assistant_leds
          effect: Twinkle
          state: true
    mode: single
    parameters: {}
  - id: control_leds_voice_assistant_idle_phase
    then:
      - light.turn_off:
          id: voice_assistant_leds
          state: false
      - if:
          condition:
            light.is_on:
              id: led_ring
          then:
            - light.turn_on:
                id: led_ring
                state: true
    mode: single
    parameters: {}
  - id: control_leds_voice_assistant_waiting_for_command_phase
    then:
      - light.turn_on:
          brightness: !lambda |-
            return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: Waiting for Command
          state: true
    mode: single
    parameters: {}
  - id: control_leds_voice_assistant_listening_for_command_phase
    then:
      - light.turn_on:
          brightness: !lambda |-
            return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: Listening For Command
          state: true
    mode: single
    parameters: {}
  - id: control_leds_voice_assistant_thinking_phase
    then:
      - light.turn_on:
          brightness: !lambda |-
            return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: Thinking
          state: true
    mode: single
    parameters: {}
  - id: control_leds_voice_assistant_replying_phase
    then:
      - light.turn_on:
          brightness: !lambda |-
            return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: Replying
          state: true
    mode: single
    parameters: {}
  - id: control_leds_voice_assistant_error_phase
    then:
      - light.turn_on:
          brightness: !lambda |-
            return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          red: 1.0
          green: 0.0
          blue: 0.0
          id: voice_assistant_leds
          effect: Error
          state: true
    mode: single
    parameters: {}
  - id: control_leds_muted_or_silent
    then:
      - light.turn_on:
          brightness: !lambda |-
            return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: Muted or Silent
          state: true
    mode: single
    parameters: {}
  - id: control_leds_voice_assistant_not_ready_phase
    then:
      - light.turn_on:
          brightness: 0.66
          red: 1.0
          green: 0.0
          blue: 0.0
          id: voice_assistant_leds
          effect: Twinkle
          state: true
    mode: single
    parameters: {}
  - id: control_leds_dial_touched
    then:
      - light.turn_on:
          brightness: !lambda |-
            return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: Volume Display
          state: true
    mode: single
    parameters: {}
  - id: control_leds_jack_unplugged_recently
    then:
      - light.turn_on:
          brightness: !lambda |-
            return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: Jack Unplugged
          state: true
    mode: single
    parameters: {}
  - id: control_leds_jack_plugged_recently
    then:
      - light.turn_on:
          brightness: !lambda |-
            return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: Jack Plugged
          state: true
    mode: single
    parameters: {}
  - id: control_leds_center_button_touched
    then:
      - light.turn_on:
          brightness: !lambda |-
            return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: Center Button Touched
          state: true
    mode: single
    parameters: {}
  - id: control_leds_timer_ringing
    then:
      - light.turn_on:
          brightness: !lambda |-
            return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
          id: voice_assistant_leds
          effect: Timer Ring
          state: true
    mode: single
    parameters: {}
  - id: control_leds_timer_ticking
    then:
      - light.turn_on:
          brightness: !lambda |-
            return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: Timer tick
          state: true
    mode: single
    parameters: {}
  - id: control_volume
    mode: restart
    parameters:
      increase_volume: bool
    then:
      - delay: 16ms
      - if:
          condition:
            lambda: !lambda |-
              return increase_volume;
          then:
            - media_player.volume_up:
                id: external_media_player
                announcement: false
          else:
            - media_player.volume_down:
                id: external_media_player
                announcement: false
      - script.execute:
          id: control_leds
      - delay: 1s
      - lambda: !lambda |-
          id(dial_touched) = false;
      - sensor.rotary_encoder.set_value:
          id: dial
          value: 0
      - script.execute:
          id: control_leds
  - id: control_group_volume
    mode: restart
    parameters:
      increase_volume: bool
    then:
      - delay: 16ms
      - if:
          condition:
            lambda: !lambda |-
              return increase_volume;
          then:
            - lambda: !lambda |-
                id(group_volume_changed) = true;
            - media_player.volume_up:
                id: sendspin_group_media_player
                announcement: false
          else:
            - lambda: !lambda |-
                id(group_volume_changed) = true;
            - media_player.volume_down:
                id: sendspin_group_media_player
                announcement: false
      - script.execute:
          id: control_leds
      - delay: 1s
      - lambda: !lambda |-
          id(dial_touched) = false;
      - lambda: !lambda |-
          id(group_volume_changed) = false;
      - sensor.rotary_encoder.set_value:
          id: dial
          value: 0
      - script.execute:
          id: control_leds
  - id: control_hue
    mode: restart
    parameters:
      increase_hue: bool
    then:
      - delay: 16ms
      - if:
          condition:
            lambda: !lambda |-
              return(abs(int(id(dial).state)) > 3 || id(color_changed));
          then:
            - lambda: !lambda |
                id(color_changed) = true;
                auto light_color = id(voice_assistant_leds).current_values;
                int hue = 0;
                float saturation = 0;
                float value = 0;
                rgb_to_hsv( light_color.get_red(),
                            light_color.get_green(),
                            light_color.get_blue(),
                            hue,
                            saturation,
                            value);
                if (increase_hue) {
                  hue = (hue + 10) % 360;
                } else {
                  hue = (hue + 350) % 360;
                }
                if (saturation < 0.05) {
                  saturation = 1;
                }
                float red = 0;
                float green = 0;
                float blue = 0;
                hsv_to_rgb( hue,
                            saturation,
                            value,
                            red,
                            green,
                            blue);
                id(voice_assistant_leds).make_call().set_rgb(red, green, blue).perform();
      - wait_until:
          condition:
            binary_sensor.is_off:
              id: center_button
      - lambda: !lambda |
          id(dial_touched) = false;
          // now we "save" the new LED color/state to led_ring, maintaining its brightness and state
          auto led_ring_call = id(led_ring).make_call();
          auto va_leds_cv = id(voice_assistant_leds).current_values;
          led_ring_call.from_light_color_values(va_leds_cv);
          led_ring_call.set_brightness(id(led_ring).current_values.get_brightness());
          led_ring_call.set_state(id(led_ring).current_values.is_on());
          led_ring_call.perform();
      - sensor.rotary_encoder.set_value:
          id: dial
          value: 0
      - script.execute:
          id: control_leds
      - delay: 500ms
      - lambda: !lambda |-
          id(color_changed) = false;
  - id: ring_timer
    then:
      - script.execute:
          id: enable_repeat_one
      - script.execute:
          id: play_sound
          priority: true
          sound_file: timer_finished_sound
    mode: single
    parameters: {}
  - id: enable_repeat_one
    then:
      - media_player.repeat_one:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 500ms
    mode: single
    parameters: {}
  - id: disable_repeat
    then:
      - media_player.repeat_off:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 0ms
    mode: single
    parameters: {}
  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: !lambda |-
              return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true
      - lambda: !lambda |-
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }
    mode: single
  - id: fetch_first_active_timer
    then:
      - lambda: !lambda |
          const auto &timers = id(va).get_timers();
          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.is_active && timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(first_active_timer) = output_timer;
    mode: single
    parameters: {}
  - id: check_if_timers_active
    then:
      - lambda: !lambda |
          const auto &timers = id(va).get_timers();
          bool output = false;
          for (const auto &timer : timers) {
            if (timer.is_active) {
              output = true;
            }
          }
          id(is_timer_active) = output;
    mode: single
    parameters: {}
  - id: activate_stop_word_once
    then:
      - wait_until:
          condition:
            media_player.is_announcing:
              id: external_media_player
          timeout: 5s
      - delay: 1s
      - if:
          condition:
            switch.is_off:
              id: timer_ringing
          then:
            - micro_wake_word.enable_model:
                id: stop
            - wait_until:
                condition:
                  not:
                    media_player.is_announcing:
                      id: external_media_player
            - if:
                condition:
                  switch.is_off:
                    id: timer_ringing
                then:
                  - micro_wake_word.disable_model:
                      id: stop
    mode: single
    parameters: {}
