substitutions:
  voice_assist_idle_phase_id: '1'
  voice_assist_waiting_for_command_phase_id: '2'
  voice_assist_listening_for_command_phase_id: '3'
  voice_assist_thinking_phase_id: '4'
  voice_assist_replying_phase_id: '5'
  voice_assist_not_ready_phase_id: '10'
  voice_assist_error_phase_id: '11'
  hidden_ssid: 'false'
  jack_connected_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/jack_connected.flac
  jack_disconnected_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/jack_disconnected.flac
  mute_switch_on_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/mute_switch_on.flac
  mute_switch_off_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/mute_switch_off.flac
  timer_finished_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/timer_finished.flac
  wake_word_triggered_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/wake_word_triggered.flac
  center_button_press_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/center_button_press.flac
  center_button_double_press_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/center_button_double_press.flac
  center_button_triple_press_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/center_button_triple_press.flac
  center_button_long_press_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/center_button_long_press.flac
  factory_reset_initiated_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/factory_reset_initiated.mp3
  factory_reset_cancelled_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/factory_reset_cancelled.mp3
  factory_reset_confirmed_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/factory_reset_confirmed.mp3
  easter_egg_tick_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/easter_egg_tick.mp3
  easter_egg_tada_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/easter_egg_tada.mp3
  error_cloud_expired_sound_file: https://raw.githubusercontent.com/esphome/home-assistant-voice-pe/2644f4c794271d735d182ca7ebf899ed46164f4e/sounds/error_cloud_expired.mp3
esphome:
  name: home-assistant-voice
  friendly_name: Home Assistant Voice
  name_add_mac_suffix: true
  min_version: 2026.6.0
  on_boot:
    - priority: 375.0
      then:
        - script.execute:
            id: control_leds
        - delay: 1s
        - switch.turn_on:
            id: internal_speaker_amp
        - delay: 10min
        - if:
            condition:
              lambda: !lambda |-
                return id(init_in_progress);
            then:
              - lambda: !lambda |-
                  id(init_in_progress) = false;
              - script.execute:
                  id: control_leds
  project:
    name: Nabu Casa.Home Assistant Voice PE
    version: 26.9.0-atlas.1
  build_path: build/home-assistant-voice
  platformio_options: {}
  build_flags: []
  environment_variables: {}
  includes: []
  includes_c: []
  libraries: []
  merge_warnings: true
  debug_scheduler: false
  areas: []
  devices: []
esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHZ
  variant: ESP32S3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: 5.5.5
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: y
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: y
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: y
    log_level: ERROR
    advanced:
      compiler_optimization: SIZE
      enable_idf_experimental_features: false
      enable_lwip_assert: true
      ignore_efuse_custom_mac: false
      ignore_efuse_mac_crc: false
      sram1_as_iram: false
      enable_lwip_mdns_queries: true
      enable_lwip_bridge_interface: false
      enable_lwip_tcpip_core_locking: true
      enable_lwip_check_thread_safety: true
      disable_libc_locks_in_iram: true
      disable_vfs_support_termios: true
      disable_vfs_support_select: true
      disable_vfs_support_dir: true
      freertos_in_iram: false
      ringbuf_in_iram: false
      heap_in_iram: false
      execute_from_psram: false
      loop_task_stack_size: 8192
      enable_ota_rollback: true
      enable_ota_downgrade_protection: false
      use_full_certificate_bundle: false
      include_builtin_idf_components: []
      enable_full_printf: false
      disable_debug_stubs: true
      disable_ocd_aware: true
      disable_usb_serial_jtag_secondary: true
      disable_dev_null_vfs: true
      disable_mbedtls_peer_cert: true
      disable_mbedtls_pkcs7: true
      disable_regi2c_in_iram: true
      adc_oneshot_in_iram: false
      disable_fatfs: true
    components: []
  toolchain: esp-idf
  watchdog_timeout: 5s
voice_assistant:
  on_client_connected:
    then:
      - wait_until:
          condition:
            not:
              ble.enabled: {}
      - delay: 2s
      - lambda: !lambda |-
          id(init_in_progress) = false;
      - micro_wake_word.start: {}
      - lambda: !lambda |-
          id(voice_assistant_phase) = 1;
      - script.execute:
          id: control_leds
  id: va
  microphone:
    - microphone: i2s_mics
      channels:
        - 0
      bits_per_sample: 16
      gain_factor: 1
    - microphone: i2s_mics
      channels:
        - 1
      bits_per_sample: 16
      gain_factor: 1
  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0
  volume_multiplier: 1.0
  on_client_disconnected:
    then:
      - voice_assistant.stop: {}
      - lambda: !lambda |-
          id(voice_assistant_phase) = 10;
      - script.execute:
          id: control_leds
  on_error:
    then:
      - if:
          condition:
            and:
              - lambda: !lambda |-
                  return !id(init_in_progress);
              - lambda: !lambda |-
                  return code != "duplicate_wake_up_detected";
              - lambda: !lambda |-
                  return code != "stt-no-text-recognized";
          then:
            - lambda: !lambda |-
                id(voice_assistant_phase) = 11;
            - script.execute:
                id: control_leds
      - if:
          condition:
            and:
              - lambda: !lambda |-
                  return code == "cloud-auth-failed";
          then:
            - script.execute:
                id: play_sound
                priority: true
                sound_file: error_cloud_expired
  on_start:
    then:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0s
  on_listening:
    then:
      - lambda: !lambda |-
          id(voice_assistant_phase) = 2;
      - script.execute:
          id: control_leds
  on_stt_vad_start:
    then:
      - lambda: !lambda |-
          id(voice_assistant_phase) = 3;
      - script.execute:
          id: control_leds
  on_stt_vad_end:
    then:
      - lambda: !lambda |-
          id(voice_assistant_phase) = 4;
      - script.execute:
          id: control_leds
  on_intent_progress:
    then:
      - if:
          condition:
            lambda: !lambda |-
              return !x.empty();
          then:
            - lambda: !lambda |-
                id(voice_assistant_phase) = 5;
            - script.execute:
                id: control_leds
            - script.execute:
                id: activate_stop_word_once
  on_tts_start:
    then:
      - if:
          condition:
            lambda: !lambda |-
              return id(voice_assistant_phase) != 5;
          then:
            - lambda: !lambda |-
                id(voice_assistant_phase) = 5;
            - script.execute:
                id: control_leds
            - script.execute:
                id: activate_stop_word_once
  on_end:
    then:
      - wait_until:
          condition:
            not:
              voice_assistant.is_running: {}
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 1s
      - if:
          condition:
            lambda: !lambda |-
              return id(voice_assistant_phase) == 11;
          then:
            - delay: 1s
      - lambda: !lambda |-
          id(voice_assistant_phase) = 1;
      - script.execute:
          id: control_leds
  on_timer_finished:
    then:
      - switch.turn_on:
          id: timer_ringing
  on_timer_started:
    then:
      - script.execute:
          id: control_leds
  on_timer_cancelled:
    then:
      - script.execute:
          id: control_leds
  on_timer_updated:
    then:
      - script.execute:
          id: control_leds
  on_timer_tick:
    then:
      - script.execute:
          id: control_leds
  conversation_timeout: 300s
wifi:
  on_disconnect:
    then:
      - ble.enable: {}
      - script.execute:
          id: control_leds
  id: wifi_id
  fast_connect:
    enabled: false
    storage: flash
  on_connect:
    then:
      - lambda: !lambda |-
          id(improv_ble_in_progress) = false;
      - script.execute:
          id: control_leds
      - if:
          condition:
            and:
              - binary_sensor.is_on:
                  id: jack_plugged
          then:
            - sendspin.media_source.enable_static_delay_adjustment: {}
          else:
            - sendspin.media_source.disable_static_delay_adjustment: {}
      - delay: 5s
      - ble.disable: {}
      - script.execute:
          id: control_leds
  domain: .local
  reboot_timeout: 15min
  power_save_mode: LIGHT
  enable_btm: false
  enable_rrm: false
  passive_scan: false
  enable_on_boot: true
  post_connect_roaming: true
  min_auth_mode: WPA2
  networks: []
  use_address: home-assistant-voice.local
network:
  enable_ipv6: true
  min_ipv6_addr_count: 0
logger:
  level: DEBUG
  logs:
    sensor: WARN
  baud_rate: 115200
  tx_buffer_size: 512
  deassert_rts_dtr: false
  task_log_buffer_size: 768
  hardware_uart: USB_SERIAL_JTAG
  runtime_tag_levels: false
api:
  id: api_id
  on_client_connected:
    then:
      - script.execute:
          id: control_leds
  on_client_disconnected:
    then:
      - script.execute:
          id: control_leds
  encryption: {}
  port: 6053
  reboot_timeout: 15min
  batch_delay: 100ms
  custom_services: false
  homeassistant_services: false
  homeassistant_states: false
  listen_backlog: 4
  max_connections: 5
  max_send_queue: 8
ota:
  - platform: esphome
    id: ota_esphome
    version: 2
    port: 3232
    allow_partition_access: false
i2c:
  - id: internal_i2c
    sda: 5
    scl: 6
    frequency: 400000.0
    sda_pullup_enabled: true
    scl_pullup_enabled: true
    scan: true
psram:
  mode: octal
  speed: 80MHZ
  ignore_not_found: false
  enable_ecc: false
  disabled: false
globals:
  - id: global_led_animation_index
    type: int
    restore_value: false
    initial_value: '0'
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: improv_ble_in_progress
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: voice_assistant_phase
    type: int
    restore_value: false
    initial_value: '10'
  - id: dial_touched
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: color_changed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: group_volume_changed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: jack_plugged_recently
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: jack_unplugged_recently
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: first_active_timer
    type: voice_assistant::Timer
    restore_value: false
  - id: is_timer_active
    type: bool
    restore_value: false
  - id: factory_reset_requested
    type: bool
    restore_value: false
    initial_value: 'false'
switch:
  - platform: template
    id: master_mute_switch
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:microphone-off
    name: Mute
    entity_category: config
    lambda: !lambda |-
      // Muted either if the hardware mute switch is on or the microphone's software mute switch is enabled
      if (id(hardware_mute_switch).state || id(i2s_mics).get_mute_state()) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      then:
        - if:
            condition:
              binary_sensor.is_off:
                id: hardware_mute_switch
            then:
              - microphone.mute: {}
    turn_off_action:
      then:
        - if:
            condition:
              binary_sensor.is_off:
                id: hardware_mute_switch
            then:
              - microphone.unmute: {}
    on_turn_on:
      - then:
          - script.execute:
              id: control_leds
    on_turn_off:
      - then:
          - script.execute:
              id: control_leds
    disabled_by_default: false
    optimistic: false
    assumed_state: false
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: mdi:bullhorn
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: false
    assumed_state: false
  - platform: template
    id: disable_buttons
    name: Disable physical controls
    icon: mdi:button-pointer
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    disabled_by_default: true
    assumed_state: false
  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - then:
          - micro_wake_word.disable_model:
              id: stop
          - script.execute:
              id: disable_repeat
          - if:
              condition:
                media_player.is_announcing:
                  id: external_media_player
              then:
                - media_player.stop:
                    announcement: true
                    id: external_media_player
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1s
          - script.execute:
              id: control_leds
    on_turn_on:
      - then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 20
              duration: 0s
          - micro_wake_word.enable_model:
              id: stop
          - script.execute:
              id: ring_timer
          - script.execute:
              id: control_leds
          - delay: 15min
          - switch.turn_off:
              id: timer_ringing
    disabled_by_default: false
    assumed_state: false
    name: timer_ringing
  - platform: gpio
    pin:
      number: 47
      mode:
        output: true
        input: false
        open_drain: false
        pullup: false
        pulldown: false
      inverted: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    id: internal_speaker_amp
    name: Internal speaker amp
    entity_category: config
    restore_mode: ALWAYS_OFF
    internal: true
    disabled_by_default: false
    interlock_wait_time: 0ms
binary_sensor:
  - platform: gpio
    id: center_button
    pin:
      number: 0
      inverted: true
      mode:
        input: true
        output: false
        open_drain: false
        pullup: false
        pulldown: false
      ignore_pin_validation_error: false
      ignore_strapping_warning: false
      drive_strength: 20.0
    on_press:
      - then:
          - if:
              condition:
                switch.is_off:
                  id: disable_buttons
              then:
                - script.execute:
                    id: control_leds
    on_release:
      - then:
          - if:
              condition:
                switch.is_off:
                  id: disable_buttons
              then:
                - script.execute:
                    id: control_leds
          - if:
              condition:
                lambda: !lambda |-
                  return id(factory_reset_requested);
              then:
                - button.press:
                    id: factory_reset_button
    on_multi_click:
      - timing:
          - state: true
            min_length: 0ms
            max_length: 1s
          - state: false
            min_length: 250ms
        then:
          - if:
              condition:
                lambda: !lambda |-
                  return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed) && !id(disable_buttons).state;
              then:
                - if:
                    condition:
                      switch.is_on:
                        id: timer_ringing
                    then:
                      - switch.turn_off:
                          id: timer_ringing
                    else:
                      - if:
                          condition:
                            voice_assistant.is_running: {}
                          then:
                            - voice_assistant.stop: {}
                          else:
                            - if:
                                condition:
                                  media_player.is_announcing:
                                    id: external_media_player
                                then:
                                  - media_player.stop:
                                      announcement: true
                                      id: external_media_player
                                else:
                                  - if:
                                      condition:
                                        media_player.is_playing:
                                          id: external_media_player
                                      then:
                                        - media_player.pause:
                                            id: external_media_player
                                            announcement: false
                                      else:
                                        - if:
                                            condition:
                                              and:
                                                - switch.is_off:
                                                    id: master_mute_switch
                                                - not:
                                                    voice_assistant.is_running: {}
                                            then:
                                              - script.execute:
                                                  id: play_sound
                                                  priority: true
                                                  sound_file: center_button_press_sound
                                              - delay: 300ms
                                              - voice_assistant.start:
                                                  silence_detection: true
        invalid_cooldown: 1s
      - timing:
          - state: true
            min_length: 0ms
            max_length: 1s
          - state: false
            min_length: 0ms
            max_length: 250ms
          - state: true
            min_length: 0ms
            max_length: 1s
          - state: false
            min_length: 250ms
        then:
          - if:
              condition:
                lambda: !lambda |-
                  return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed) && !id(disable_buttons).state;
              then:
                - script.execute:
                    id: play_sound
                    priority: false
                    sound_file: center_button_double_press_sound
                - event.trigger:
                    id: button_press_event
                    event_type: double_press
        invalid_cooldown: 1s
      - timing:
          - state: true
            min_length: 0ms
            max_length: 1s
          - state: false
            min_length: 0ms
            max_length: 250ms
          - state: true
            min_length: 0ms
            max_length: 1s
          - state: false
            min_length: 0ms
            max_length: 250ms
          - state: true
            min_length: 0ms
            max_length: 1s
          - state: false
            min_length: 250ms
        then:
          - if:
              condition:
                lambda: !lambda |-
                  return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed) && !id(disable_buttons).state;
              then:
                - script.execute:
                    id: play_sound
                    priority: false
                    sound_file: center_button_triple_press_sound
                - event.trigger:
                    id: button_press_event
                    event_type: triple_press
        invalid_cooldown: 1s
      - timing:
          - state: true
            min_length: 1s
        then:
          - if:
              condition:
                lambda: !lambda |-
                  return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed) && !id(disable_buttons).state;
              then:
                - script.execute:
                    id: play_sound
                    priority: false
                    sound_file: center_button_long_press_sound
                - light.turn_off:
                    id: voice_assistant_leds
                    state: false
                - event.trigger:
                    id: button_press_event
                    event_type: long_press
        invalid_cooldown: 1s
      - timing:
          - state: true
            min_length: 0ms
            max_length: 200ms
          - state: false
            min_length: 0s
            max_length: 2s
          - state: true
            min_length: 0ms
            max_length: 200ms
          - state: false
            min_length: 0s
            max_length: 2s
          - state: true
            min_length: 0ms
            max_length: 200ms
          - state: false
            min_length: 0s
            max_length: 2s
          - state: true
            min_length: 0ms
            max_length: 200ms
          - state: false
            min_length: 500ms
            max_length: 2s
          - state: true
            min_length: 0ms
            max_length: 200ms
          - state: false
            min_length: 0s
            max_length: 2s
          - state: true
            min_length: 200ms
            max_length: 2s
        then:
          - if:
              condition:
                lambda: !lambda |-
                  return !id(init_in_progress);
              then:
                - light.turn_on:
                    brightness: 1.0
                    id: voice_assistant_leds
                    effect: Tick
                    state: true
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: easter_egg_tick_sound
                - delay: 4s
                - light.turn_off:
                    id: voice_assistant_leds
                    state: false
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: easter_egg_tada_sound
                - light.turn_on:
                    brightness: 1.0
                    id: voice_assistant_leds
                    effect: Rainbow
                    state: true
                - event.trigger:
                    id: button_press_event
