media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
    persistent_ring_buffer: false
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000
    persistent_ring_buffer: false
  - platform: sendspin
    id: sendspin_media_source
    fixed_delay: 480us
    buffer_size: 1000000
    initial_static_delay: 0ms
    static_delay_adjustable: false
    sample_rate: 48000
    codecs:
      - flac
      - opus
      - pcm
media_player:
  - platform: sendspin
    id: sendspin_group_media_player
    disabled_by_default: false
    volume_increment: 0.05
    name: sendspin_group_media_player
    internal: true
  - platform: speaker_source
    id: external_media_player
    name: Media Player
    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_announcement_source
        - http_announcement_source
    media_pipeline:
      format: FLAC
      num_channels: 2
      sample_rate: 48000
      speaker: media_resampling_speaker
      sources:
        - http_media_source
        - sendspin_media_source
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 0.85
    on_mute:
      then:
        - script.execute:
            id: control_leds
    on_unmute:
      then:
        - script.execute:
            id: control_leds
    on_volume:
      then:
        - script.execute:
            id: control_leds
    on_announcement:
      - then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 20
              duration: 0s
    on_state:
      - then:
          - if:
              condition:
                and:
                  - switch.is_off:
                      id: timer_ringing
                  - not:
                      voice_assistant.is_running: {}
                  - not:
                      media_player.is_announcing:
                        id: external_media_player
              then:
                - mixer_speaker.apply_ducking:
                    id: media_mixing_input
                    decibel_reduction: 0
                    duration: 1s
    volume_initial: 0.5
    disabled_by_default: false
voice_kit:
  id: voice_kit_component
  i2c_id: internal_i2c
  reset_pin:
    number: 4
    mode:
      output: true
      input: false
      open_drain: false
      pullup: false
      pulldown: false
    inverted: false
    ignore_pin_validation_error: false
    ignore_strapping_warning: false
    drive_strength: 20.0
  firmware:
    url: https://github.com/esphome/voice-kit-xmos-firmware/releases/download/v1.3.1/ffva_v1.3.1_upgrade.bin
    version: 1.3.1
    md5: 964635c5bf125529dab14a2472a15401
  channel_0_stage: AGC
  channel_1_stage: NS
  address: 0x42
external_components:
  - source:
      url: https://github.com/esphome/home-assistant-voice-pe
      ref: 2644f4c794271d735d182ca7ebf899ed46164f4e
      type: git
    components:
      - voice_kit
    refresh: 0s
audio_dac:
  - platform: aic3204
    id: aic3204_dac
    i2c_id: internal_i2c
    address: 0x18
micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels:
      - 1
    gain_factor: 4
    bits_per_sample: 16
  stop_after_detection: false
  models:
    - model:
        path: /home/user/atlas-household/voicepe/models/stock/okay_nabu_20241226.3/okay_nabu.json
        type: local
      id: okay_nabu
      internal: false
    - model:
        path: /home/user/atlas-household/voicepe/models/stock/micro-wake-word-models/hey_jarvis.json
        type: local
      id: hey_jarvis
      internal: false
    - model:
        path: /home/user/atlas-household/voicepe/models/stock/micro-wake-word-models/hey_mycroft.json
        type: local
      id: hey_mycroft
      internal: false
    - model:
        path: /home/user/atlas-household/voicepe/models/stock/stop/stop.json
        type: local
      id: stop
      internal: true
    - model:
        path: /home/user/atlas-household/voicepe/models/hey_atlas/hey_atlas.json
        type: local
      id: hey_atlas
      internal: false
  vad:
    model:
      path: /home/user/atlas-household/voicepe/models/stock/micro-wake-word-models/vad.json
      type: local
    internal: false
  on_wake_word_detected:
    then:
      - if:
          condition:
            switch.is_off:
              id: master_mute_switch
          then:
            - if:
                condition:
                  switch.is_on:
                    id: timer_ringing
                then:
                  - switch.turn_off:
                      id: timer_ringing
                else:
                  - if:
                      condition:
                        voice_assistant.is_running: {}
                      then:
                        - voice_assistant.stop: {}
                      else:
                        - if:
                            condition:
                              media_player.is_announcing:
                                id: external_media_player
                            then:
                              - media_player.stop:
                                  announcement: true
                                  id: external_media_player
                            else:
                              - if:
                                  condition:
                                    switch.is_on:
                                      id: wake_sound
                                  then:
                                    - script.execute:
                                        id: play_sound
                                        priority: true
                                        sound_file: wake_word_triggered_sound
                                    - delay: 300ms
                              - voice_assistant.start:
                                  wake_word: !lambda |-
                                    return wake_word;
                                  silence_detection: true
select:
  - platform: template
    name: Wake word sensitivity
    id: wake_word_sensitivity
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      - then:
          - lambda: !lambda |-
              if (x == "Slightly sensitive") {
                id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo (Manifest's default)
                id(hey_jarvis).set_probability_cutoff(247);   // 0.97 -> 0.563 FAPH on DipCo (Manifest's default)
                id(hey_mycroft).set_probability_cutoff(253);  // 0.99 -> 0.567 FAPH on DipCo
              } else if (x == "Moderately sensitive") {
                id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
                id(hey_jarvis).set_probability_cutoff(235);   // 0.92 -> 0.939 FAPH on DipCo
                id(hey_mycroft).set_probability_cutoff(242);  // 0.95 -> 1.502 FAPH on DipCo (Manifest's default)
              } else if (x == "Very sensitive") {
                id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
                id(hey_jarvis).set_probability_cutoff(212);   // 0.83 -> 1.502 FAPH on DipCo
                id(hey_mycroft).set_probability_cutoff(237);  // 0.93 -> 1.878 FAPH on DipCo
              }
    disabled_by_default: false
    update_interval: 60s
button:
  - platform: factory_reset
    id: factory_reset_button
    name: Factory Reset
    entity_category: diagnostic
    internal: true
    disabled_by_default: false
    icon: mdi:restart-alert
    device_class: restart
  - platform: restart
    id: restart_button
    name: Restart
    entity_category: config
    disabled_by_default: true
    icon: mdi:restart
    device_class: restart
debug:
  update_interval: 5s
improv_serial: {}
esp32_ble:
  name: ha-voice-pe
  io_capability: none
  enable_on_boot: true
  advertising: false
  advertising_cycle_time: 10s
  disable_bt_logs: true
  connection_timeout: 20s
  max_notifications: 12
  max_connections: 3
esp32_improv:
  authorizer: center_button
  on_start:
    - then:
        - lambda: !lambda |-
            id(improv_ble_in_progress) = true;
        - script.execute:
            id: control_leds
  on_provisioned:
    - then:
        - lambda: !lambda |-
            id(improv_ble_in_progress) = false;
        - script.execute:
            id: control_leds
  on_stop:
    - then:
        - lambda: !lambda |-
            id(improv_ble_in_progress) = false;
        - script.execute:
            id: control_leds
  identify_duration: 10s
  authorized_duration: 1min
  wifi_timeout: 90s

